services:
  locoprep:
    build:
      context: .
      dockerfile: Dockerfile
    image: locoprep:latest
    env_file:
      - .env.local
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      LOCOPREP_DB_PATH: /data/locoprep.db
      LOCOPREP_CONFIG_PATH: /data/locoprep.config.json
    volumes:
      - ./data:/data
    restart: unless-stopped